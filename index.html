<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome to SRU</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7ff, #e8edff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            background: white;
            padding: 60px 80px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #4f46e5;
            font-size: 48px;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            font-size: 20px;
            margin-bottom: 30px;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome to SRU</h1>

        <p>Welcome to SR University</p>

        <button>Get Started</button>
    </div>

</body>
</html>
